name: SST infrastructure
# Pull requests only typecheck the SST config (no credentials, no environment: a secret or a cloud role must not reach pull-request code).
# `diff` and `deploy` run only by manual dispatch of `main`, in the environment `descope-dev`, which deploys from `main` only. There is no stored
# secret: the job asks GitHub for an OIDC token twice. AWS trusts the first (the role in the variable AWS_ROLE_ARN, for SST's state). Descope trusts the
# second, asked for the audience of a federated management key (the variable DESCOPE_MANAGEMENT_KEY_ID) and used as the provider's management key.
# Until the owner has created those variables the job stops at its first step with a notice.
on:
  pull_request:
    paths:
      - "sst.config.ts"
      - "infra/**"
      - "tsconfig.sst.json"
      - ".github/workflows/descope-infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "diff shows the difference, deploy changes the development project"
        required: true
        type: choice
        options:
          - diff
          - deploy

permissions:
  contents: read

env:
  MISE_LOCKED: "1" # an out-of-date mise.lock fails the install instead of being rewritten

concurrency:
  group: descope-infra
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck the SST config
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - run: bun install --frozen-lockfile
      - run: bun run check:infra

  run:
    name: SST ${{ inputs.action }} (descope-dev)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: descope-dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Stop cleanly while the variables do not exist
        id: gate
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          KEY_ID: ${{ vars.DESCOPE_MANAGEMENT_KEY_ID }}
        run: |
          if [ -z "${AWS_ROLE_ARN}" ] || [ -z "${AWS_REGION}" ] || [ -z "${KEY_ID}" ]; then
            echo "::notice title=Skipped::The variables AWS_ROLE_ARN, AWS_REGION and DESCOPE_MANAGEMENT_KEY_ID of the environment descope-dev are not all set, so nothing ran. This is expected until the owner creates them."
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.blocked != 'true'
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        if: steps.gate.outputs.blocked != 'true'
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - run: bun install --frozen-lockfile
        if: steps.gate.outputs.blocked != 'true'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.gate.outputs.blocked != 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Request the workload identity token for Descope
        if: steps.gate.outputs.blocked != 'true'
        id: wif
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          KEY_ID: ${{ vars.DESCOPE_MANAGEMENT_KEY_ID }}
        with:
          script: |
            const token = await core.getIDToken(`https://api.descope.com/${process.env.KEY_ID}`)
            core.setSecret(token)
            core.setOutput('token', token)
      - name: SST ${{ inputs.action }}
        if: steps.gate.outputs.blocked != 'true'
        env:
          DESCOPE_MANAGEMENT_KEY: ${{ steps.wif.outputs.token }}
          ACTION: ${{ inputs.action }}
        run: bunx sst "$ACTION" --stage descope-dev
