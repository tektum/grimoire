name: SST infrastructure
# Pull requests only typecheck the SST config (no credentials, no environment: a secret or a cloud role must not reach pull-request code).
# `diff` and `deploy` run only by manual dispatch of `main`, in the environment of the chosen stage (`descope-dev` or `staging`), each of which deploys from `main` only. There is no stored
# secret: the job asks GitHub for an OIDC token twice. AWS trusts the first (the role in the variable AWS_ROLE_ARN, for SST's state). Descope trusts the
# second, asked for the audience of a federated management key (the variable DESCOPE_MANAGEMENT_KEY_ID) and used as the provider's management key.
# The Descope provider plugin is installed with Pulumi's `plugin install --checksum` (the sha256 below) before either credential is
# requested. Until the owner has created the variables the job stops at its first step with a notice.
on:
  pull_request:
    paths:
      - "sst.config.ts"
      - "infra/**"
      - "tsconfig.sst.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/descope-infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "diff shows the difference, deploy changes the stage"
        required: true
        type: choice
        options:
          - diff
          - deploy
      stage:
        description: "descope-dev is the development identity-provider project, staging is the hosted staging site with its own project"
        required: true
        type: choice
        options:
          - descope-dev
          - staging

permissions:
  contents: read

env:
  MISE_LOCKED: "1" # an out-of-date mise.lock fails the install instead of being rewritten
  # The Descope provider plugin (version of sst.config.ts) and the sha256 of its linux-amd64 release asset. Update both with the provider.
  DESCOPE_PROVIDER_VERSION: "1.0.1"
  DESCOPE_PROVIDER_SHA256: "0e376aa5c573aad73be62e8d17bf3f9e4e505d3a9af839e8d5ac189d815ab5c5"

concurrency:
  group: descope-infra
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck the SST config
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - run: bun install --frozen-lockfile
      - run: bun run check:infra

  run:
    name: SST ${{ inputs.action }} (${{ inputs.stage }})
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # a first staging deploy waits for the database to be made
    environment: ${{ inputs.stage }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Stop cleanly while the variables do not exist
        id: gate
        env:
          STAGE: ${{ inputs.stage }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          KEY_ID: ${{ vars.DESCOPE_MANAGEMENT_KEY_ID }}
        run: |
          if [ -z "${AWS_ROLE_ARN}" ] || [ -z "${AWS_REGION}" ] || [ -z "${KEY_ID}" ]; then
            echo "::notice title=Skipped::The variables AWS_ROLE_ARN, AWS_REGION and DESCOPE_MANAGEMENT_KEY_ID of the environment ${STAGE} are not all set, so nothing ran. This is expected until the owner creates them."
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.blocked != 'true'
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        if: steps.gate.outputs.blocked != 'true'
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - run: bun install --frozen-lockfile
        if: steps.gate.outputs.blocked != 'true'
      - name: Install the Descope provider plugin with its pinned checksum, before any credential exists
        if: steps.gate.outputs.blocked != 'true'
        run: |
          bunx sst install
          export PULUMI_HOME="$HOME/.config/sst" # SST keeps its plugins here
          "$PULUMI_HOME/bin/pulumi" plugin install resource descope "$DESCOPE_PROVIDER_VERSION" --server github://api.github.com/descope --checksum "$DESCOPE_PROVIDER_SHA256" --reinstall
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.gate.outputs.blocked != 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Request the workload identity token for Descope
        if: steps.gate.outputs.blocked != 'true'
        id: wif
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          KEY_ID: ${{ vars.DESCOPE_MANAGEMENT_KEY_ID }}
        with:
          script: |
            const token = await core.getIDToken(`https://api.descope.com/${process.env.KEY_ID}`)
            core.setSecret(token)
            core.setOutput('token', token)
      - name: SST ${{ inputs.action }}
        if: steps.gate.outputs.blocked != 'true'
        env:
          DESCOPE_MANAGEMENT_KEY: ${{ steps.wif.outputs.token }}
          ACTION: ${{ inputs.action }}
          STAGE: ${{ inputs.stage }}
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
          STAGING_ALLOWED_EMAIL_DOMAINS: ${{ vars.STAGING_ALLOWED_EMAIL_DOMAINS }}
          STAGING_FIRST_ADMIN_EMAILS: ${{ vars.STAGING_FIRST_ADMIN_EMAILS }}
        run: bunx sst "$ACTION" --stage "$STAGE"
