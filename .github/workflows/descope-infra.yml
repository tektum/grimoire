name: SST infrastructure
# Pull requests only typecheck the SST config (no credentials, no environment: a secret or a cloud role must not reach pull-request code).
# Every action runs only by manual dispatch of `main`, in the environment of the chosen stage (`dev` or `staging`, the same stack with its own settings), each of which deploys from `main` only, and every change to AWS is made by the stage's role, never by a person's session. There is no stored
# secret: the job asks GitHub for an OIDC token twice. AWS trusts the first (the role in the variable AWS_ROLE_ARN, for SST's state). Descope trusts the
# second, asked for the audience of a federated management key (the variable DESCOPE_MANAGEMENT_KEY_ID) and used as the provider's management key.
# The provider plugins (infra/pulumi-plugins.txt: Descope, AWS and the others a deploy loads) are installed with Pulumi's `plugin install --checksum` before either credential is
# requested. Until the owner has created the variables the job stops at its first step with a notice.
on:
  pull_request:
    paths:
      - "sst.config.ts"
      - "infra/**"
      - "tsconfig.sst.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/descope-infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "diff shows the difference; deploy changes the stage and starts its service if a freeze stopped it; freeze stops the service so nothing writes to the database, thaw starts it again; snapshot takes one of the database and prints its ARN; check reads the database (versions, counts, row-level security). The last four are the move to Aurora (docs/operations/database-setup.md)"
        required: true
        type: choice
        options:
          - diff
          - deploy
          - freeze
          - thaw
          - snapshot
          - check
      stage:
        description: "every stage is the same stack with its own address, sizes and Descope project: the same commit is deployed to each in turn (production is the customer-facing one)"
        required: true
        type: choice
        options:
          - dev
          - production
          - staging

permissions:
  contents: read

env:
  MISE_LOCKED: "1" # an out-of-date mise.lock fails the install instead of being rewritten

concurrency:
  group: descope-infra
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck the SST config
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - run: bun install --frozen-lockfile
      - run: bun run check:infra

  run:
    name: SST ${{ inputs.action }} (${{ inputs.stage }})
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # a first staging deploy waits for the database to be made
    environment: ${{ inputs.stage }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Stop cleanly while the variables do not exist
        id: gate
        env:
          STAGE: ${{ inputs.stage }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          KEY_ID: ${{ vars.DESCOPE_MANAGEMENT_KEY_ID }}
          GRIMOIRE_DOMAIN: ${{ vars.GRIMOIRE_DOMAIN }}
          GRIMOIRE_ALLOWED_EMAIL_DOMAINS: ${{ vars.GRIMOIRE_ALLOWED_EMAIL_DOMAINS }}
        run: |
          # Every variable the stage needs is checked here, before the job assumes the AWS role or asks for the Descope token.
          missing=""
          for name in AWS_ROLE_ARN AWS_REGION KEY_ID GRIMOIRE_DOMAIN GRIMOIRE_ALLOWED_EMAIL_DOMAINS; do
            [ -n "${!name}" ] || missing="${missing} ${name}"
          done
          if [ -n "${missing}" ]; then
            echo "::notice title=Skipped::The variable(s)${missing} of the environment ${STAGE} are not set (KEY_ID is the variable DESCOPE_MANAGEMENT_KEY_ID), so nothing ran. This is expected until the owner creates them."
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.blocked != 'true'
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        if: steps.gate.outputs.blocked != 'true'
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - run: bun install --frozen-lockfile
        if: steps.gate.outputs.blocked != 'true'
      - name: Install the provider plugins of infra/pulumi-plugins.txt with their pinned checksums, before any credential exists
        if: steps.gate.outputs.blocked != 'true'
        env:
          # The plugins are release assets on GitHub: without a token the download shares the runners' address limit (60 requests an hour) and fails when it is used up.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bunx sst install
          export PULUMI_HOME="$HOME/.config/sst" # SST keeps its plugins here
          while read -r name version server sha256; do
            case "$name" in '' | '#'*) continue ;; esac
            "$PULUMI_HOME/bin/pulumi" plugin install resource "$name" "$version" --server "$server" --checksum "$sha256" --reinstall
          done < infra/pulumi-plugins.txt
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.gate.outputs.blocked != 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Request the workload identity token for Descope
        if: steps.gate.outputs.blocked != 'true'
        id: wif
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          KEY_ID: ${{ vars.DESCOPE_MANAGEMENT_KEY_ID }}
        with:
          script: |
            const token = await core.getIDToken(`https://api.descope.com/${process.env.KEY_ID}`)
            core.setSecret(token)
            core.setOutput('token', token)
      - name: SST ${{ inputs.action }}
        if: steps.gate.outputs.blocked != 'true' && (inputs.action == 'diff' || inputs.action == 'deploy')
        env:
          DESCOPE_MANAGEMENT_KEY: ${{ steps.wif.outputs.token }}
          ACTION: ${{ inputs.action }}
          STAGE: ${{ inputs.stage }}
          PULUMI_DISABLE_AUTOMATIC_PLUGIN_ACQUISITION: "true" # a plugin that is not in infra/pulumi-plugins.txt stops the run instead of being downloaded unchecked
          GRIMOIRE_DOMAIN: ${{ vars.GRIMOIRE_DOMAIN }}
          GRIMOIRE_ALLOWED_EMAIL_DOMAINS: ${{ vars.GRIMOIRE_ALLOWED_EMAIL_DOMAINS }}
          GRIMOIRE_REFUSED_EMAIL_DOMAINS: ${{ vars.GRIMOIRE_REFUSED_EMAIL_DOMAINS }}
          GRIMOIRE_FIRST_ADMIN_EMAILS: ${{ vars.GRIMOIRE_FIRST_ADMIN_EMAILS }}
          GRIMOIRE_AURORA_SNAPSHOT: ${{ vars.GRIMOIRE_AURORA_SNAPSHOT }}
        run: bunx sst "$ACTION" --stage "$STAGE"
      - name: Stop the service, so nothing writes to the database (freeze)
        if: steps.gate.outputs.blocked != 'true' && inputs.action == 'freeze'
        env:
          STAGE: ${{ inputs.stage }}
        run: tools/deploy/freeze.sh freeze "$STAGE"
      - name: Find the database and the cluster of the stage, by what SST makes, and check they are in one network
        if: steps.gate.outputs.blocked != 'true' && (inputs.action == 'snapshot' || inputs.action == 'check')
        id: targets
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          bash tools/adopt/targets.sh "${STAGE}" | tee -a "${GITHUB_OUTPUT}"
      # Named for the stage and this run: the name the move's setting GRIMOIRE_AURORA_SNAPSHOT accepts (infra/stages.ts), and a new one every time.
      - name: Take a snapshot of the database, wait until it can be restored from, and print its ARN
        if: steps.gate.outputs.blocked != 'true' && inputs.action == 'snapshot'
        env:
          STAGE: ${{ inputs.stage }}
          DATABASE: ${{ steps.targets.outputs.database }}
          KIND: ${{ steps.targets.outputs.database_kind }}
        run: |
          set -euo pipefail
          name="grimoire-${STAGE}-run-${GITHUB_RUN_ID}"
          bash tools/adopt/snapshot.sh "${KIND}" "${DATABASE}" "${name}"
          if [ "${KIND}" = "instance" ]; then
            arn=$(aws rds describe-db-snapshots --db-snapshot-identifier "${name}" --query 'DBSnapshots[0].DBSnapshotArn' --output text)
          else
            arn=$(aws rds describe-db-cluster-snapshots --db-cluster-snapshot-identifier "${name}" --query 'DBClusterSnapshots[0].DBClusterSnapshotArn' --output text)
          fi
          echo "snapshot ARN: ${arn}" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Check the database, read-only, as a task of the stage's service
        if: steps.gate.outputs.blocked != 'true' && inputs.action == 'check'
        env:
          CLUSTER: ${{ steps.targets.outputs.cluster }}
        run: bash tools/deploy/db-check.sh "${CLUSTER}"
      # A deploy starts a service that a freeze stopped (and otherwise changes nothing), so the gate below sees the stage serving again.
      - name: Start the service again if a freeze stopped it
        if: steps.gate.outputs.blocked != 'true' && (inputs.action == 'deploy' || inputs.action == 'thaw')
        env:
          STAGE: ${{ inputs.stage }}
        run: tools/deploy/freeze.sh thaw "$STAGE"
      # A deploy that leaves the site without a healthy task must not end green: wait for the one complete deployment and readyz 200 (three polls in a row), or fail the run.
      - name: Wait until the stage serves
        if: steps.gate.outputs.blocked != 'true' && (inputs.action == 'deploy' || inputs.action == 'thaw')
        env:
          STAGE: ${{ inputs.stage }}
          GRIMOIRE_DOMAIN: ${{ vars.GRIMOIRE_DOMAIN }}
        run: tools/deploy/wait-healthy.sh "$STAGE" "$GRIMOIRE_DOMAIN"
