name: Stack Guard

# A pull request whose base is not main is only held to the rules of main when it is part of a stack. This light workflow (read-only, no checkout) fails such a pull
# request until it is linked with `gh stack link`. `edited` is sent when the base branch changes, so a retarget is checked again; the CURRENT base and stack are read
# from the API, so linking the stack and re-running the job is enough.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stack-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stack-guard:
    name: Stack Guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: A pull request into a branch other than main must be part of a stack
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          # Read the pull request once, retrying a transient API error. If it still cannot be
          # read, fail (closed) with a message that says so, not one that blames the base branch.
          pr=""
          for attempt in 1 2 3 4; do
            if pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER") && [ -n "$(printf '%s' "$pr" | jq -r '.base.ref // empty' 2>/dev/null)" ]; then
              break
            fi
            pr=""
            echo "Attempt $attempt: could not read the pull request from the GitHub API."
            [ "$attempt" -lt 4 ] && sleep $((attempt * 3))
          done
          if [ -z "$pr" ]; then
            echo "::error::The GitHub API read of this pull request failed after 4 attempts, so the base branch could not be checked. This is not a verdict on the base: re-run this job."
            exit 1
          fi
          base=$(printf '%s' "$pr" | jq -r '.base.ref')
          stack=$(printf '%s' "$pr" | jq -r '.stack // empty')
          if [ "$base" = "main" ]; then
            echo "Base is main: nothing to check."
            exit 0
          fi
          if [ -z "$stack" ]; then
            echo "::error::This pull request targets '$base', not main, and is not part of a stack. Link it with 'gh stack link' so that it is held to the rules of main, then re-run this job."
            exit 1
          fi
          echo "Part of a stack: ok."
