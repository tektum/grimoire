# Runners: every job runs on GitHub's `ubuntu-latest` (4 vCPU, 16 GB of memory, about 14 GB of free disk on this public repository). RunsOn is for a job that cannot: more memory or disk
# than that (show the peak), another architecture, or a network the hosted runners cannot be in. Such a job says why in a comment next to its `runs-on`, and tools/ci/test/runners.test.mjs
# refuses a RunsOn label with no reason.
# The mise binary is pinned below (version and the sha256 of the extracted binary). Bump both by hand
# together, and keep min_version in mise.toml at or below it; Renovate updates the tools in mise.toml and mise.lock.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # replay stack: pull requests based on replay/** branches are checked too (remove when the replay is finished)
    branches: [main, 'replay/**']

permissions:
  contents: read

env:
  MISE_LOCKED: "1" # an out-of-date mise.lock fails the install instead of being rewritten

concurrency:
  # Key PR runs by number so they cannot cancel the push run for a merged commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: gitleaks
      - name: Scan commits (the history of the checked-out commit, not other branches)
        run: gitleaks git --config .gitleaks.toml --redact --verbose --log-opts HEAD .
      - name: Scan tree
        run: gitleaks dir --config .gitleaks.toml --redact --verbose .

  workflow-policy:
    name: Workflow Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: actionlint zizmor shellcheck
      # With the pinned shellcheck named, as `mise run lint-workflows` does on a checkout: actionlint skips the shell scripts silently when it finds none, and the script fails when the shellcheck is not there.
      - name: Run actionlint
        run: tools/ci/actionlint.sh
      # The test of this very step: a bare `!` fails it with the pinned shellcheck. The tools are installed here, so a missing one is a failure and not a skip.
      - name: Test the workflow lint
        env:
          REQUIRE_LINT_TOOLS: '1'
        run: node --test tools/ci/test/workflow-lint.test.mjs
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .

  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      semantic: ${{ steps.diff.outputs.semantic }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          code=true
          # Documentation-only changes skip the code jobs, except docs/api-surface.txt: it is checked against the build, so editing it is a code change.
          if [ -n "${BASE_SHA:-}" ]; then
            changed=$(git diff --name-only "$BASE_SHA"...HEAD)
            if ! printf '%s\n' "$changed" | grep -qvE '^(docs/|.*\.md$|LICENSE$)' && ! printf '%s\n' "$changed" | grep -qx 'docs/api-surface.txt'; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # The job that downloads the models (it depends on Hugging Face being up) runs on a push and when a change touches what it runs: the adapter, the models and their lock, the port and the conformance suite the test runs, the lock of the packages and the install setting.
          semantic=true
          if [ -n "${BASE_SHA:-}" ]; then
            semantic=false
            if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(packages/adapters/embedder-onnx/|apps/server/test/semantic/|models/|scripts/fetch-models\.mjs$|packages/core/src/ports/embedder\.ts$|packages/core/src/testing/embedder-conformance\.ts$|bun\.lock$|\.npmrc$|\.github/workflows/ci\.yml$)'; then semantic=true; fi
          fi
          echo "semantic=$semantic" >> "$GITHUB_OUTPUT"

  static:
    name: Static checks
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The build comes first: it writes the OpenAPI document and the client types the other two read.
      - run: bun run build
      - run: bun run lint
      - run: bun run typecheck

  openapi:
    name: OpenAPI check
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Build, then compare the API surface with docs/api-surface.txt; any difference fails
        run: bun run openapi:check
      - name: Upload the full OpenAPI document
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: packages/api-client/openapi.json
          if-no-files-found: ignore
          retention-days: 7

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Codecov upload by OIDC; contents stays read
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Fresh-runner preflight (IPv6 loopback)
        run: |
          getent ahostsv6 localhost >/dev/null || sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=0
          node -e "require('node:net').createServer().listen(0,'::1',function(){this.close()})"
      - name: Build (workspace packages resolve through their built output)
        run: bun run build
      - run: bun run test:coverage:ci
      - name: Record the workspace the coverage blob was made in
        if: ${{ !cancelled() }}
        run: |
          mkdir -p vitest-blob-roots
          echo "$GITHUB_WORKSPACE" > vitest-blob-roots/unit.root
      - name: Upload coverage blob (merged with the integration coverage by the Coverage job)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-unit
          path: |
            vitest-blobs/unit.json
            vitest-blob-roots/unit.root
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          flags: unit
          use_oidc: true
          fail_ci_if_error: false
      - run: bun run test:tools

  licence:
    name: Licence check
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run licence
      - run: bun run licence:check-images
      - name: Upload licence-report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licence-report
          path: tools/licence-report/out
          if-no-files-found: ignore
          retention-days: 7

  compose-config:
    name: Compose config
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create .env and validate the Compose files
        run: |
          cp .env.example .env
          docker compose -p grimoire config --quiet

  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Codecov upload by OIDC; contents stays read
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: make db-up
      - run: bun run build
      - run: bun run test:integration:coverage:ci
      - name: Record the workspace the coverage blob was made in
        if: ${{ !cancelled() }}
        run: |
          mkdir -p vitest-blob-roots
          echo "$GITHUB_WORKSPACE" > vitest-blob-roots/integration.root
      - name: Upload coverage blob (merged with the unit coverage by the Coverage job)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-integration
          path: |
            vitest-blobs/integration.json
            vitest-blob-roots/integration.root
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/integration/lcov.info
          flags: integration
          use_oidc: true
          fail_ci_if_error: false
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload integration-logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down

  coverage:
    name: Coverage (unit and integration merged)
    needs: [changes, unit, integration]
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Download the coverage blobs of the unit and integration jobs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-blob-*
          merge-multiple: true
          path: .
      - name: Point the blobs at this workspace (they carry the paths of the runners that made them)
        run: node tools/ci/rebase-blobs.mjs vitest-blobs vitest-blob-roots
      - name: Check the floors on the merged coverage
        run: bun run test:coverage:merged
      - name: Check that every floor matched files of the merged report, all under this workspace
        if: ${{ !cancelled() }}
        run: node tools/ci/check-floor-matches.mjs coverage/merged/coverage-summary.json
      - name: Coverage per package
        if: ${{ !cancelled() }}
        run: node tools/ci/coverage-summary.mjs coverage/merged/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Image and stack
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make up
      # The semantic search's files in the image that was just built (M7-T12): both models and their lock, no GPU library, a size within the budget, and the embedder on the real models
      # inside it, on the distroless base, with no network, a read-only root filesystem, every capability dropped and no TMPDIR.
      - name: Semantic search in the image
        run: |
          set -eu
          image=grimoire-app
          size=$(docker image inspect -f '{{.Size}}' "$image")
          echo "image size: $((size / 1048576)) MiB"
          test "$size" -le $((900 * 1048576))
          container=$(docker create "$image")
          docker export "$container" | tar -t > image-files.txt
          docker rm "$container" > /dev/null
          grep -q '^app/models/multilingual-e5-base/model_quantized.onnx$' image-files.txt
          grep -q '^app/models/multilingual-e5-small/model_quantized.onnx$' image-files.txt
          grep -q '^app/models/models.lock.json$' image-files.txt
          if grep -iE 'cuda|tensorrt|libnvinfer' image-files.txt; then echo '::error::a GPU library is in the image'; exit 1; fi
          test "$(docker image inspect -f '{{.Config.User}}' "$image")" = 65532:65532
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/tools/ci/semantic-image-smoke.mjs:/smoke.mjs:ro" --entrypoint /nodejs/bin/node "$image" /smoke.mjs
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload image-logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-logs
          path: compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes

  e2e-m1:
    name: Exit test M1
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The stack of this job runs with the semantic search off: its image is built without the model files (the Image job builds and checks the full one).
    env:
      GRIMOIRE_IMAGE_MODELS: skip
      GRIMOIRE_SEMANTIC_SEARCH: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: make up
      - run: make test-m1
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload e2e-m1-results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-m1-results
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes

  e2e-m2:
    name: Exit test M2
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The stack of this job runs with the semantic search off: its image is built without the model files (the Image job builds and checks the full one).
    env:
      GRIMOIRE_IMAGE_MODELS: skip
      GRIMOIRE_SEMANTIC_SEARCH: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: make up
      - run: make test-m2
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload e2e-m2-results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-m2-results
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes

  e2e-m3:
    name: Exit test M3
    needs: changes
