# Runners: every job runs on GitHub's `ubuntu-latest` (4 vCPU, 16 GB of memory, about 14 GB of free disk on this public repository) unless it says why next to its `runs-on`: a pinned image such
# as `ubuntu-24.04` (the Playwright jobs: `# RUNNER:` comment) or RunsOn (more memory or disk than that, with the peak shown; another architecture; a network the hosted runners cannot be in: `# RunsOn:`
# comment). tools/ci/test/runners.test.mjs refuses a RunsOn label or a pinned image that has no such reason.
# The mise binary is pinned below (version and the sha256 of the extracted binary). Bump both by hand
# together, and keep min_version in mise.toml at or below it; Renovate updates the tools in mise.toml and mise.lock.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # replay stack: pull requests based on replay/** branches are checked too (remove when the replay is finished)
    branches: [main, 'replay/**']

permissions:
  contents: read

env:
  MISE_LOCKED: "1" # an out-of-date mise.lock fails the install instead of being rewritten

concurrency:
  # Key PR runs by number so they cannot cancel the push run for a merged commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      semantic: ${{ steps.diff.outputs.semantic }}
      search: ${{ steps.diff.outputs.search }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          code=true
          # Documentation-only changes skip the code jobs, except docs/api-surface.txt: it is checked against the build, so editing it is a code change.
          if [ -n "${BASE_SHA:-}" ]; then
            changed=$(git diff --name-only "$BASE_SHA"...HEAD)
            if ! printf '%s\n' "$changed" | grep -qvE '^(docs/|.*\.md$|LICENSE$)' && ! printf '%s\n' "$changed" | grep -qx 'docs/api-surface.txt'; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # The job that downloads the models (it depends on Hugging Face being up) runs on a push and when a change touches what it runs: the adapter, the models and their lock, the port and the conformance suite the test runs, the lock of the packages and the install setting.
          semantic=true
          if [ -n "${BASE_SHA:-}" ]; then
            semantic=false
            if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(packages/adapters/embedder-onnx/|apps/server/test/semantic/|models/|scripts/fetch-models\.mjs$|packages/core/src/ports/embedder\.ts$|packages/core/src/testing/embedder-conformance\.ts$|bun\.lock$|\.npmrc$|\.github/workflows/ci\.yml$)'; then semantic=true; fi
          fi
          echo "semantic=$semantic" >> "$GITHUB_OUTPUT"
          # The search latency job loads 140,000 vectors (minutes): only a pull request that touches the search or the embeddings pays for it; the nightly benchmark job runs the same test for everything else.
          search=false
          if [ -n "${BASE_SHA:-}" ] && git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(packages/core/src/(search|semantic)/|packages/core/src/ports/(search-repo|embedding-store)\.ts$|packages/adapters/db-kysely/src/(search|embeddings)\.ts$|db/migrations/|apps/server/test/benchmark/hybrid-latency\.test\.ts$|compose\.search-latency\.yaml$|\.github/workflows/ci\.yml$)'; then search=true; fi
          echo "search=$search" >> "$GITHUB_OUTPUT"

  # The small checks of a change on ONE machine. They were six jobs of 8 seconds to 1.5 minutes each, and every job costs a runner start, a checkout and a tool install, and waits in the queue on its own.
  # A step per former job, named as the job was (Secret Scan, Workflow Policy, Compose config, Licence check, OpenAPI check, Static checks), so a failure reads as before. Every step runs even when an earlier one
  # failed (`!cancelled()`), so one run still shows every failing check; the last step writes the table of results to the job summary. Secret Scan and Workflow Policy run for every change, documentation
  # included, as they did; the others only for a code change and, but for Compose config, not for a fork's pull request (the conditions the jobs had). The job needs `changes` for that: it adds its few seconds.
  checks:
    name: Checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the history
          persist-credentials: false
      - id: lint-tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: gitleaks actionlint zizmor shellcheck
      - name: Secret Scan (the history of the checked-out commit, not other branches)
        id: secret-history
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: gitleaks git --config .gitleaks.toml --redact --verbose --log-opts HEAD .
      - name: Secret Scan (the tree)
        id: secret-tree
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: gitleaks dir --config .gitleaks.toml --redact --verbose .
      # With the pinned shellcheck named, as `mise run lint-workflows` does on a checkout: actionlint skips the shell scripts silently when it finds none, and the script fails when the shellcheck is not there.
      - name: Workflow Policy (actionlint)
        id: actionlint
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: tools/ci/actionlint.sh
      # The test of this very step: a bare `!` fails it with the pinned shellcheck. The tools are installed here, so a missing one is a failure and not a skip.
      - name: Workflow Policy (the test of the workflow lint)
        id: workflow-lint-test
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        env:
          REQUIRE_LINT_TOOLS: '1'
        run: node --test tools/ci/test/workflow-lint.test.mjs
      - name: Workflow Policy (zizmor)
        id: zizmor
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .
      - name: Compose config (create .env and validate the Compose files)
        id: compose-config
        if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
        run: |
          cp .env.example .env
          docker compose -p grimoire config --quiet
      - id: code-tools
        if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - if: ${{ !cancelled() && steps.code-tools.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - id: install
        if: ${{ !cancelled() && steps.code-tools.outcome == 'success' }}
        run: bun install --frozen-lockfile
      - name: Licence check (the installed packages and the recorded rest)
        id: licence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run licence
      - name: Licence check (the container base images)
        id: licence-images
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run licence:check-images
      - name: OpenAPI check (build, then compare the API surface with docs/api-surface.txt; any difference fails)
        id: openapi
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run openapi:check
      # The build comes first: it writes the OpenAPI document and the client types the other two read.
      - name: Static checks (build)
        id: static-build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build
      - name: Static checks (lint)
        id: static-lint
        if: ${{ !cancelled() && steps.static-build.outcome == 'success' }}
        run: bun run lint
      - name: Static checks (typecheck)
        id: static-typecheck
        if: ${{ !cancelled() && steps.static-build.outcome == 'success' }}
        run: bun run typecheck
      - name: Upload the full OpenAPI document
        if: ${{ !cancelled() && steps.openapi.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: packages/api-client/openapi.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload licence-report
        if: ${{ !cancelled() && steps.licence.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licence-report
          path: tools/licence-report/out
          if-no-files-found: ignore
          retention-days: 7
      - name: Result of every check
        if: ${{ always() }}
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          jq -r '"| check | result |", "|---|---|", (to_entries[] | select(.value.outcome != null) | "| \(.key) | \(.value.outcome) |")' <<< "$STEPS_JSON" >> "$GITHUB_STEP_SUMMARY"

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Codecov upload by OIDC; contents stays read
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Fresh-runner preflight (IPv6 loopback)
        run: |
          getent ahostsv6 localhost >/dev/null || sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=0
          node -e "require('node:net').createServer().listen(0,'::1',function(){this.close()})"
      - name: Build (workspace packages resolve through their built output)
        run: bun run build
      - run: bun run test:coverage:ci
      - name: Record the workspace the coverage blob was made in
        if: ${{ !cancelled() }}
        run: |
          mkdir -p vitest-blob-roots
          echo "$GITHUB_WORKSPACE" > vitest-blob-roots/unit.root
      - name: Upload coverage blob (merged with the integration coverage by the Coverage job)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-unit
          overwrite: true # a re-run of the job replaces its blob: the one of the failed attempt must not be merged with the new one
          path: |
            vitest-blobs/unit.json
            vitest-blob-roots/unit.root
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          flags: unit
          use_oidc: true
          fail_ci_if_error: false
      - run: bun run test:tools

  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Codecov upload by OIDC; contents stays read
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: make db-up
      - run: bun run build
      - run: bun run test:integration:coverage:ci
      - name: Record the workspace the coverage blob was made in
        if: ${{ !cancelled() }}
        run: |
          mkdir -p vitest-blob-roots
          echo "$GITHUB_WORKSPACE" > vitest-blob-roots/integration.root
      - name: Upload coverage blob (merged with the unit coverage by the Coverage job)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-integration
          overwrite: true # a re-run of the job replaces its blob: the one of the failed attempt must not be merged with the new one
          path: |
            vitest-blobs/integration.json
            vitest-blob-roots/integration.root
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/integration/lcov.info
          flags: integration
          use_oidc: true
          fail_ci_if_error: false
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload integration-logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down

  coverage:
    name: Coverage (unit and integration merged)
    needs: [changes, unit, integration]
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Download the coverage blobs of the unit and integration jobs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-blob-*
          merge-multiple: true
          path: .
      - name: Point the blobs at this workspace (they carry the paths of the runners that made them)
        run: node tools/ci/rebase-blobs.mjs vitest-blobs vitest-blob-roots
      - name: Check the floors on the merged coverage
        run: bun run test:coverage:merged
      - name: Check that every floor matched files of the merged report, all under this workspace
        if: ${{ !cancelled() }}
        run: node tools/ci/check-floor-matches.mjs coverage/merged/coverage-summary.json
      - name: Coverage per package
        if: ${{ !cancelled() }}
        run: node tools/ci/coverage-summary.mjs coverage/merged/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Image and stack
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make up
      # The semantic search's files in the image that was just built (M7-T12): both models and their lock, no GPU library, a size within the budget, and the embedder on the real models
      # inside it, on the distroless base, with no network, a read-only root filesystem, every capability dropped and no TMPDIR.
      - name: Semantic search in the image
        run: |
          set -eu
          image=grimoire-app
          size=$(docker image inspect -f '{{.Size}}' "$image")
          echo "image size: $((size / 1048576)) MiB"
          test "$size" -le $((900 * 1048576))
          container=$(docker create "$image")
          docker export "$container" | tar -t > image-files.txt
          docker rm "$container" > /dev/null
          grep -q '^app/models/multilingual-e5-base/model_quantized.onnx$' image-files.txt
          grep -q '^app/models/multilingual-e5-small/model_quantized.onnx$' image-files.txt
          grep -q '^app/models/models.lock.json$' image-files.txt
          if grep -iE 'cuda|tensorrt|libnvinfer' image-files.txt; then echo '::error::a GPU library is in the image'; exit 1; fi
          test "$(docker image inspect -f '{{.Config.User}}' "$image")" = 65532:65532
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/tools/ci/semantic-image-smoke.mjs:/smoke.mjs:ro" --entrypoint /nodejs/bin/node "$image" /smoke.mjs
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload image-logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-logs
          path: compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes

  # The exit tests of milestones 1, 2 and 3 on ONE machine, one after the other (they were three jobs of 4m45, 4m40 and 6m10): about 15.5 minutes, under the longest job of the run (the WebKit browser job, about 18).
  # A step per former job with its artifact (e2e-m1-results, e2e-m2-results, e2e-m3-results), a stack taken down between them, and every exit test runs even when an earlier one failed (`!cancelled()`), so one run still shows every failing one.
  e2e-m1-m3:
    name: Exit tests M1, M2 and M3
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # The stack of this job runs with the semantic search off: its image is built without the model files (the Image job builds and checks the full one).
    env:
      GRIMOIRE_IMAGE_MODELS: skip
      GRIMOIRE_SEMANTIC_SEARCH: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - id: install
        run: bun install --frozen-lockfile
      - name: Exit test M1
        id: m1
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          make up
          make test-m1
      - name: Collect Compose logs (M1)
        if: ${{ !cancelled() && steps.m1.outcome == 'failure' }}
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload e2e-m1-results
        if: ${{ !cancelled() && steps.m1.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-m1-results
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down (M1)
        if: ${{ always() && steps.m1.outcome != 'skipped' }}
        run: make down-volumes
      - name: Exit test M2
        id: m2
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          rm -rf test-results compose.log # the results of the exit tests before this one are not this one's: its artifact holds its own
          make up
          make test-m2
      - name: Collect Compose logs (M2)
        if: ${{ !cancelled() && steps.m2.outcome == 'failure' }}
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload e2e-m2-results
        if: ${{ !cancelled() && steps.m2.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-m2-results
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down (M2)
        if: ${{ always() && steps.m2.outcome != 'skipped' }}
        run: make down-volumes
      - name: Exit test M3
        id: m3
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          rm -rf test-results compose.log # as for M2
          make test-m3
      - name: Collect Compose logs (M3)
        if: ${{ !cancelled() && steps.m3.outcome == 'failure' }}
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload e2e-m3-results
        if: ${{ !cancelled() && steps.m3.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-m3-results
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down (M3)
        if: ${{ always() && steps.m3.outcome != 'skipped' }}
        run: make down-volumes
      - name: Result of every exit test
        if: ${{ always() }}
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          jq -r '"| exit test | result |", "|---|---|", (to_entries[] | select(.value.outcome != null) | "| \(.key) | \(.value.outcome) |")' <<< "$STEPS_JSON" >> "$GITHUB_STEP_SUMMARY"

  e2e-m4:
    name: Exit test M4
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The stack of this job runs with the semantic search off: its image is built without the model files (the Image job builds and checks the full one).
    env:
      GRIMOIRE_IMAGE_MODELS: skip
      GRIMOIRE_SEMANTIC_SEARCH: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: make test-m4
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload e2e-m4-results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-m4-results
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes

  e2e-m5:
    name: Exit test M5
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # RUNNER: ubuntu-24.04 and not ubuntu-latest: `ubuntu-latest` is Ubuntu 26.04 since November 2026, and the system libraries this Playwright installs WebKit's dependencies for (libicu 74) are those of 24.04 (a WebKit launch failed on `libicudata.so.74`). Move to `ubuntu-latest` with the Playwright that supports 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The stack of this job runs with the semantic search off: its image is built without the model files (the Image job builds and checks the full one).
    env:
      GRIMOIRE_IMAGE_MODELS: skip
      GRIMOIRE_SEMANTIC_SEARCH: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The real-browser checks of the file store (apps/server/test-e2e/m5/browser) run inside `make test-m5`; the browser is installed here, once.
      - run: tools/ci/playwright-install.sh chromium
      - run: make test-m5
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload e2e-m5-results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-m5-results
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes

  e2e-web:
    name: Web browser tests
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # RUNNER: ubuntu-24.04 and not ubuntu-latest: `ubuntu-latest` is Ubuntu 26.04 since November 2026, and the system libraries this Playwright installs WebKit's dependencies for (libicu 74) are those of 24.04 (a WebKit launch failed on `libicudata.so.74`). Move to `ubuntu-latest` with the Playwright that supports 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The stack of this job runs with the semantic search off: its image is built without the model files (the Image job builds and checks the full one).
    env:
      GRIMOIRE_IMAGE_MODELS: skip
      GRIMOIRE_SEMANTIC_SEARCH: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The specs of apps/web/test-e2e run in a real browser against the stack. This job is not in `CI Required` yet: its first runs say what fails and who owns it.
      - run: tools/ci/playwright-install.sh chromium
      - run: make test-web-e2e
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload e2e-web-results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-results
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes

  e2e-web-browsers:
    name: Web browser tests (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # RUNNER: ubuntu-24.04 and not ubuntu-latest: `ubuntu-latest` is Ubuntu 26.04 since November 2026, and the system libraries this Playwright installs WebKit's dependencies for (libicu 74) are those of 24.04 (a WebKit launch failed on `libicudata.so.74`). Move to `ubuntu-latest` with the Playwright that supports 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # The stack of this job runs with the semantic search off: its image is built without the model files (the Image job builds and checks the full one).
    env:
      GRIMOIRE_IMAGE_MODELS: skip
      GRIMOIRE_SEMANTIC_SEARCH: 'off'
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The same specs as `e2e-web` (Chromium), run in Firefox and in WebKit (R11.22: the latest Chrome, Edge, Firefox and Safari; Edge is Chromium, Safari is WebKit), each in its own
      # job so that the run time of a pull request is that of the slowest. Not in `CI Required`: like `e2e-web`, its first runs say what fails and who owns it.
      - run: tools/ci/playwright-install.sh ${{ matrix.browser }}
      - run: make test-web-e2e-browser
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload e2e-web-results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-results-${{ matrix.browser }}
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes

  search-latency:
    name: Search latency (${{ matrix.shape }})
    needs: changes
    if: needs.changes.outputs.search == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Staging's database class (db.t4g.micro: 1 GiB, 2 vCPU, shared buffers about 180 MB, JIT off): recorded, not asserted, so that what users get is on the record without the job failing for it.
          - shape: staging
            memory: 1g
            shared_buffers: 180MB
            cache_size: 360MB
            assert: '0'
          # A database that holds the vectors in memory (4 GiB): the shape the limits of R9.10 are asserted on.
          - shape: roomy
            memory: 4g
            shared_buffers: 1GB
            cache_size: 3GB
            assert: '1'
    env:
      COMPOSE_FILE: compose.yaml:compose.search-latency.yaml
      LATENCY_PG_MEMORY: ${{ matrix.memory }}
      LATENCY_PG_SHARED_BUFFERS: ${{ matrix.shared_buffers }}
      LATENCY_PG_CACHE_SIZE: ${{ matrix.cache_size }}
      GRIMOIRE_HYBRID_SHAPE: ${{ matrix.shape }}
      GRIMOIRE_HYBRID_ASSERT: ${{ matrix.assert }}
      GRIMOIRE_HYBRID_EXPERIMENTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: make db-up
      - run: bun run build
      # The semantic statement over 140,000 vectors of 768 dimensions and the whole hybrid request, against the limits of R9.10; the measured sizes and times are printed (and kept as a file on failure).
      - run: GRIMOIRE_HYBRID_OUT="$PWD/test-results/hybrid-latency-${GRIMOIRE_HYBRID_SHAPE}.json" bunx vitest run --project benchmark apps/server/test/benchmark/hybrid-latency.test.ts
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hybrid-latency-${{ matrix.shape }}
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes

  semantic-models:
    name: Semantic models
    needs: changes
    if: needs.changes.outputs.semantic == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # PostgreSQL for the event-loop test (the real embed-page job on the real store, with saves going through the real page store): the same `make db-up` and `make down` as the Integration job.
      - run: make db-up
      - run: bun run build
      # The model files, kept by the hash of the lock: a new revision in the lock is a new key. A hit is still checked below (`--verify`: size and SHA-256 of every file).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            models/multilingual-e5-base
            models/multilingual-e5-small
          key: models-${{ hashFiles('models/models.lock.json') }}
      # The only network use of the model path: the two models, each file checked against models/models.lock.json (SHA-256 and size) before it is kept.
      - run: node scripts/fetch-models.mjs
      - run: node scripts/fetch-models.mjs --verify
      # The Embedder conformance suite on the real models (e5-base and e5-small): the proof of the embedder's worker thread and tokenizer, which the unit run's coverage leaves out. Not in `CI Required` yet.
      # The recall at 5 (at least 0.8 for the default model), the similarity of searches that match nothing, the memory and the chunks a second: printed, and recorded in docs/proof/m7-semantic-quality.md.
      # The event-loop test: a page of 20,000 words embedded with the real model while saves go on, p99 of the loop delay at most 50 ms, its maximum at most 200 ms, every save under 500 ms (printed as `eventLoop`).
      - run: GRIMOIRE_MODEL_DIR="$PWD/models" bunx vitest run --project container packages/adapters/embedder-onnx apps/server/test/semantic
      # The script the image job runs inside the image, here on the checkout with the same models: it fails here, on its own, if the script is wrong.
      - run: GRIMOIRE_MODEL_DIR="$PWD/models" EMBEDDER_MODULE="$PWD/packages/adapters/embedder-onnx/dist/index.js" node tools/ci/semantic-image-smoke.mjs
      - name: Tear down
        if: always()
        run: make down

  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - checks
      - unit
      - integration
      - coverage
      - image
      - e2e-m1-m3
      - e2e-m4
      - e2e-m5
      - e2e-web
      - e2e-web-browsers
      - search-latency
      - semantic-models
    steps:
      - name: Verify every needed job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -eu
          # A failed or cancelled job always fails the gate. A skipped job passes only where the skip is meant: the changes job reported a documents-only change (code=false), or the job is one of
          # the two with a path filter and the filter said no (Search latency runs for a change to the search or the embeddings, Semantic models for a change to the embedder, its tests or the models).
          # Anything else that is skipped fails: a job that should have run and did not is not a pass.
          code=$(jq -r '.changes.outputs.code // "true"' <<< "$NEEDS_JSON")
          semantic=$(jq -r '.changes.outputs.semantic // "true"' <<< "$NEEDS_JSON")
          search=$(jq -r '.changes.outputs.search // "true"' <<< "$NEEDS_JSON")
          # A missing output counts as "true" for all three: a changes job that did not say is a changes job that did not run, and the filters then cannot excuse a skip.
          # shellcheck disable=SC2016 # $code, $search and $semantic are jq variables here, bound by --arg below, not shell variables
          skipok='def skipok($k): $code == "false" or ($k == "search-latency" and $search != "true") or ($k == "semantic-models" and $semantic != "true");'
          jq -r --arg code "$code" --arg semantic "$semantic" --arg search "$search" "$skipok"' to_entries[] | if .value.result == "success" then "OK   \(.key)" elif .value.result == "skipped" and skipok(.key) then "SKIP \(.key)" else "FAIL \(.key) (result=\(.value.result))" end' <<< "$NEEDS_JSON"
          if jq -e --arg code "$code" --arg semantic "$semantic" --arg search "$search" "$skipok"' [ to_entries[] | select(.value.result != "success") | select(.value.result != "skipped" or (skipok(.key) | not)) ] | length > 0' <<< "$NEEDS_JSON" >/dev/null; then
            echo ""
            echo "::error::One or more required jobs did not succeed. CI gate failing."
            exit 1
          fi
          echo ""
          echo "All required jobs succeeded. CI gate passes."
