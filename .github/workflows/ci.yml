# RunsOn label convention for heavy jobs that arrive with the code (not used
# yet: every job below is a tiny gate job on ubuntu-latest):
#   runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-<job>/runner=4cpu-linux-x64
# The mise binary is pinned below (version and the sha256 of the extracted binary). Bump both by hand
# together, and keep min_version in mise.toml at or below it; Renovate updates the tools in mise.toml and mise.lock.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # replay stack: pull requests based on replay/** branches are checked too (remove when the replay is finished)
    branches: [main, 'replay/**']

permissions:
  contents: read

env:
  MISE_LOCKED: "1" # an out-of-date mise.lock fails the install instead of being rewritten

concurrency:
  # Key PR runs by number so they cannot cancel the push run for a merged commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: gitleaks
      - name: Scan commits (the history of the checked-out commit, not other branches)
        run: gitleaks git --config .gitleaks.toml --redact --verbose --log-opts HEAD .
      - name: Scan tree
        run: gitleaks dir --config .gitleaks.toml --redact --verbose .

  workflow-policy:
    name: Workflow Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: actionlint zizmor
      - name: Run actionlint
        run: actionlint
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .

  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          code=true
          if [ -n "${BASE_SHA:-}" ] && ! git diff --name-only "$BASE_SHA"...HEAD | grep -qvE '^(docs/|.*\.md$|LICENSE$)'; then code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  static:
    name: Static checks
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ format('runs-on={0}-{1}-static/runner=4cpu-linux-x64', github.run_id, github.run_attempt) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ format('runs-on={0}-{1}-unit/runner=4cpu-linux-x64', github.run_id, github.run_attempt) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Fresh-runner preflight (IPv6 loopback)
        run: |
          getent ahostsv6 localhost >/dev/null || sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=0
          node -e "require('node:net').createServer().listen(0,'::1',function(){this.close()})"
      - run: bun run test
      - run: bun run test:tools

  licence:
    name: Licence check
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ format('runs-on={0}-{1}-licence/runner=4cpu-linux-x64', github.run_id, github.run_attempt) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run licence
      - name: Upload licence-report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licence-report
          path: tools/licence-report/out
          if-no-files-found: ignore
          retention-days: 7

  compose-config:
    name: Compose config
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create .env and validate the Compose files
        run: |
          cp .env.example .env
          docker compose -p grimoire config --quiet

  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ format('runs-on={0}-{1}-integration/runner=4cpu-linux-x64', github.run_id, github.run_attempt) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: make db-up
      - run: bun run build
      - run: bun run test:integration
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload integration-logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down

  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - gitleaks
      - workflow-policy
      - changes
      - static
      - unit
      - licence
      - compose-config
      - integration
    steps:
      - name: Verify every needed job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -eu
          # A failed or cancelled job always fails the gate. A skipped job passes only when the changes job
          # reported a documents-only change (code=false): anything else that is skipped fails.
          code=$(jq -r '.changes.outputs.code // "true"' <<< "$NEEDS_JSON")
          jq -r 'to_entries[] | if .value.result == "success" then "OK   \(.key)" else "FAIL \(.key) (result=\(.value.result))" end' <<< "$NEEDS_JSON"
          if jq -e --arg code "$code" '[ to_entries[] | select(.value.result != "success") | select(.value.result != "skipped" or $code == "true") ] | length > 0' <<< "$NEEDS_JSON" >/dev/null; then
            echo ""
            echo "::error::One or more required jobs did not succeed. CI gate failing."
            exit 1
          fi
          echo ""
          echo "All required jobs succeeded. CI gate passes."
