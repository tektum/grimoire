name: pgvector image
# M7-T10: what only a container runtime can show about the database image. On a pull request that changes the image or its checks, and on demand. Informational: not part of CI Required.
# The whole integration suite on the new image is the `Integration tests` job of CI (`make db-up` starts the image of compose.yaml).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - compose.yaml
      - compose.pgvector087.yaml
      - db/init/**
      - mk/test-m7.mk
      - tools/licence-report/image-packages.mjs
      - tools/licence-report/image-exceptions.json
      - tools/licence-report/allowed-licences.mjs
      - tools/licence-report/images.json
      - apps/server/test/migrations/semantic/**
      - .github/workflows/pgvector-image.yml

permissions:
  contents: read

env:
  MISE_LOCKED: "1" # an out-of-date mise.lock fails the install instead of being rewritten
  # The same Debian release as the image under audit (bookworm), so that what is listed as added is what pgvector adds, not a different release's names for the base libraries.
  BASELINE_IMAGE: postgres:17-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Package audit of the database image
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node
      - name: Audit the database image of compose.yaml against the baseline (exit 1 on a new package that is not permitted and has no exception)
        run: |
          mkdir -p proof
          status=0
          node tools/licence-report/image-packages.mjs --compare "$BASELINE_IMAGE" --new-from-compose compose.yaml --out proof/m7-pgvector-image.md || status=$?
          cat proof/m7-pgvector-image.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: The same audit for the second image of the semantic tests (compose.pgvector087.yaml)
        if: ${{ !cancelled() }}
        run: |
          status=0
          node tools/licence-report/image-packages.mjs --compare "$BASELINE_IMAGE" --new-from-compose compose.yaml,compose.pgvector087.yaml --out proof/m7-pgvector-image-087.md || status=$?
          cat proof/m7-pgvector-image-087.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload the audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m7-pgvector-image
          path: proof/
          retention-days: 30
          if-no-files-found: ignore

  pgvector-087:
    name: pgvector 0.8.7 (second image)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: The semantic tests on pgvector 0.8.7
        run: make test-pgvector-087
