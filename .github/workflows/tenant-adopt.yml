name: Adopt a tenant
# A one-off, by hand, on `main`, in the environment of the chosen stage: runs `grimoire tenant-adopt --from legacy --to <tenant id>` (docs/operations/database-setup.md) as a task of the stage's own
# service, with the same image, network and credentials as the migration step, so the command runs where the database is and nothing new can reach it. It moves the whole `legacy` workspace of
# the stage into the tenant given, in one transaction (after a snapshot of the database, waited for), and refuses (changing nothing) when the target holds data or `legacy` holds none. It is not part of a deploy: an operator starts it once,
# after the deploy that carries the command, and the stage's owner is told first. No stored secret: AWS trusts the job's OIDC token (the role in the variable AWS_ROLE_ARN).
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "the stage whose legacy workspace is adopted"
        required: true
        type: choice
        options:
          - dev
          - staging
      to:
        description: "the tenant id to move the workspace into (the id of the identity provider's tenant of the people who sign in)"
        required: true
        type: string
      name:
        description: "the name of the tenant, only when it does not exist yet (made at a first sign-in otherwise)"
        required: false
        type: string
      domain:
        description: "the email domain of the tenant, only when it does not exist yet"
        required: false
        type: string
      confirm:
        description: "type the stage name again to confirm: this changes the data of the stage"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: descope-infra # a deploy and an adoption of one stage never run together
  cancel-in-progress: false

jobs:
  adopt:
    name: Adopt into ${{ inputs.to }} (${{ inputs.stage }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.stage }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the inputs before anything is assumed
        env:
          STAGE: ${{ inputs.stage }}
          CONFIRM: ${{ inputs.confirm }}
          TO: ${{ inputs.to }}
          NAME: ${{ inputs.name }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          [ "${CONFIRM}" = "${STAGE}" ] || { echo "::error::confirm must be the stage name (${STAGE})"; exit 1; }
          # `[[ =~ ]]` matches the whole value; `grep` would pass a value of which one line matches (an input sent through the API can hold newlines).
          id='^[A-Za-z0-9_-]{1,128}$'
          label='^[A-Za-z0-9][A-Za-z0-9 ._-]{0,119}$'
          host='^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
          [[ "${TO}" =~ ${id} ]] || { echo "::error::to is not a tenant id"; exit 1; }
          [ -z "${NAME}" ] || [[ "${NAME}" =~ ${label} ]] || { echo "::error::name has characters this job does not pass on"; exit 1; }
          [ -z "${DOMAIN}" ] || [[ "${DOMAIN}" =~ ${host} ]] || { echo "::error::domain is not a host name"; exit 1; }
          if [ -n "${DOMAIN}${NAME}" ] && { [ -z "${DOMAIN}" ] || [ -z "${NAME}" ]; }; then echo "::error::name and domain go together"; exit 1; fi
          exit 0
      - name: Check the variables of the stage's environment before the role is assumed
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          STAGE: ${{ inputs.stage }}
        run: |
          missing=""
          for name in AWS_ROLE_ARN AWS_REGION; do
            [ -n "${!name}" ] || missing="${missing} ${name}"
          done
          [ -z "${missing}" ] || { echo "::error::the variable(s)${missing} of the environment ${STAGE} are not set"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Take a snapshot of the database first, and wait until it can be restored from
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          # Retained resources of a replaced stage keep their prefix: exactly one database must match, and it must be the one in the network of the stage's service.
          matches=$(aws rds describe-db-instances --query "DBInstances[?starts_with(DBInstanceIdentifier, 'grimoire-${STAGE}-')].DBInstanceIdentifier" --output json)
          [ "$(printf '%s' "${matches}" | jq length)" = "1" ] || { echo "::error::expected one database of the stage ${STAGE}, found: ${matches}"; exit 1; }
          instance=$(printf '%s' "${matches}" | jq -r '.[0]')
          db_vpc=$(aws rds describe-db-instances --db-instance-identifier "${instance}" --query 'DBInstances[0].DBSubnetGroup.VpcId' --output text)
          clusters=$(aws ecs list-clusters --query "clusterArns[?contains(@, 'grimoire-${STAGE}-')]" --output json)
          [ "$(printf '%s' "${clusters}" | jq length)" = "1" ] || { echo "::error::expected one cluster of the stage ${STAGE}, found: ${clusters}"; exit 1; }
          subnet=$(aws ecs describe-services --cluster "$(printf '%s' "${clusters}" | jq -r '.[0]')" --services Server --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets[0]' --output text)
          service_vpc=$(aws ec2 describe-subnets --subnet-ids "${subnet}" --query 'Subnets[0].VpcId' --output text)
          [ "${db_vpc}" = "${service_vpc}" ] || { echo "::error::the database ${instance} is not in the network of the service (${db_vpc} against ${service_vpc})"; exit 1; }
          snapshot="grimoire-${STAGE}-before-adopt-$(date -u +%Y%m%d-%H%M%S)"
          aws rds create-db-snapshot --db-instance-identifier "${instance}" --db-snapshot-identifier "${snapshot}" --query 'DBSnapshot.Status' --output text
          aws rds wait db-snapshot-available --db-snapshot-identifier "${snapshot}"
          echo "snapshot ${snapshot} is available: it is what a restore of this stage's data starts from"
      - name: Run the command as a task of the stage's service
        env:
          STAGE: ${{ inputs.stage }}
          TO: ${{ inputs.to }}
          NAME: ${{ inputs.name }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -euo pipefail
          clusters=$(aws ecs list-clusters --query "clusterArns[?contains(@, 'grimoire-${STAGE}-')]" --output json)
          [ "$(printf '%s' "${clusters}" | jq length)" = "1" ] || { echo "::error::expected one cluster of the stage ${STAGE}, found: ${clusters}"; exit 1; }
          cluster=$(printf '%s' "${clusters}" | jq -r '.[0]')
          service=$(aws ecs describe-services --cluster "${cluster}" --services Server --query 'services[0]' --output json)
          taskdef=$(printf '%s' "${service}" | jq -r '.taskDefinition')
          network=$(printf '%s' "${service}" | jq -c '{awsvpcConfiguration: .networkConfiguration.awsvpcConfiguration}')
          # The command goes to the migration container (the one that holds the migrator's connection string). The app container is made to exit at once: it must not serve without a load balancer.
          args=$(jq -nc --arg to "${TO}" --arg name "${NAME}" --arg domain "${DOMAIN}" '["apps/server/dist/cli.js","tenant-adopt","--from","legacy","--to",$to] + (if $name != "" then ["--name",$name,"--domain",$domain] else [] end)')
          overrides=$(jq -nc --argjson args "${args}" '{containerOverrides: [{name: "migrate", command: $args}, {name: "app", command: ["-e", "0"]}]}')
          task=$(aws ecs run-task --cluster "${cluster}" --task-definition "${taskdef}" --launch-type FARGATE --network-configuration "${network}" --overrides "${overrides}" --query 'tasks[0].taskArn' --output text)
          [ -n "${task}" ] && [ "${task}" != "None" ] || { echo "::error::the task did not start"; exit 1; }
          echo "task ${task##*/}"
          # The waiter gives up after about 10 minutes and the task may run longer (it starts, sets up, then adopts): wait again, the job's own timeout bounds it.
          until aws ecs wait tasks-stopped --cluster "${cluster}" --tasks "${task}"; do :; done
          described=$(aws ecs describe-tasks --cluster "${cluster}" --tasks "${task}" --query 'tasks[0]' --output json)
          printf '%s' "${described}" | jq -r '.containers[] | "\(.name): exit \(.exitCode // "none") \(.reason // "")"'
          # What the command said (log events, no personal data), from the container's log stream.
          group=$(aws ecs describe-task-definition --task-definition "${taskdef}" --query "taskDefinition.containerDefinitions[?name=='migrate'] | [0].logConfiguration.options.\"awslogs-group\"" --output text)
          prefix=$(aws ecs describe-task-definition --task-definition "${taskdef}" --query "taskDefinition.containerDefinitions[?name=='migrate'] | [0].logConfiguration.options.\"awslogs-stream-prefix\"" --output text)
          stream="${prefix}/migrate/${task##*/}"
          aws logs get-log-events --log-group-name "${group}" --log-stream-name "${stream}" --query 'events[].message' --output text | tr '\t' '\n' | grep -E 'tenant_adopt|migrate\.' || true
          code=$(printf '%s' "${described}" | jq -r '.containers[] | select(.name == "migrate") | .exitCode // 1')
          [ "${code}" = "0" ] || { echo "::error::tenant-adopt did not finish (exit ${code}); it changed nothing unless it printed tenant_adopt.done"; exit 1; }
