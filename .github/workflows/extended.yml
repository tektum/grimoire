name: Extended
# Informational jobs: nightly, on demand, or on a pull request labelled `extended`. Not part of CI Required.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  MISE_LOCKED: "1" # an out-of-date mise.lock fails the install instead of being rewritten

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name }} # an unrelated label has its own group and cannot cancel the extended run
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmarks (informational)
    if: (github.event_name != 'pull_request' || github.event.label.name == 'extended') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: make db-up
      - run: bun run build
      - run: bun run test:benchmark
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload benchmark-results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes

  m1-office:
    name: M1 office scenario
    if: (github.event_name != 'pull_request' || github.event.label.name == 'extended') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: make up
      - run: make test-m1-office
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload m1-office-results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m1-office-results
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes

  m1-mutation:
    name: M1 limit mutations
    if: (github.event_name != 'pull_request' || github.event.label.name == 'extended') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: make up
      - run: make test-m1-mutation
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload m1-mutation-results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m1-mutation-results
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes

  m2-hostile-mutation:
    name: M2 hostile-neighbour mutation proof
    if: (github.event_name != 'pull_request' || github.event.label.name == 'extended') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: make up
      - run: make test-m2-hostile-mutation
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload m2-hostile-mutation-results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m2-hostile-mutation-results
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes

  m3-mutation:
    name: M3 mutation proofs
    if: (github.event_name != 'pull_request' || github.event.label.name == 'extended') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: make test-m3-mutation
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload m3-mutation-results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m3-mutation-results
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes

  m7-exit:
    name: M7 exit test (make test-m7)
    if: (github.event_name != 'pull_request' || github.event.label.name == 'extended') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: make up
      # The model files, kept by the hash of the lock (the key the Semantic models job of CI uses): `make test-m7` fetches what is missing and checks every file against models/models.lock.json.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            models/multilingual-e5-base
            models/multilingual-e5-small
          key: models-${{ hashFiles('models/models.lock.json') }}
      # The exit test of milestone 7 (M7-T07): builds, checks the API surface and the list of groups, fetches the models and runs every group of apps/server/test/m7/groups.mjs against the stack that
      # `make up` started (search, jobs, hostile, synthetic, remote-images, restart, semantic with the real model, security). A group that fails does not stop the others; the step fails if one did.
      - run: make test-m7
      # The last step of the exit test command: the licence report (no violation).
      - run: bun run licence
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload m7-exit-results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m7-exit-results
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes

  m6-exit:
    name: M6 exit test (make test-m6)
    if: (github.event_name != 'pull_request' || github.event.label.name == 'extended') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # RUNNER: ubuntu-24.04 and not ubuntu-latest, as the browser jobs of CI (the system libraries Playwright installs for WebKit are those of 24.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The stack of this job runs with the semantic search off: its image is built without the model files (the Image job of CI builds and checks the full one).
    env:
      GRIMOIRE_IMAGE_MODELS: skip
      GRIMOIRE_SEMANTIC_SEARCH: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install_args: node bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The three browsers, through the script that retries the download and the apt step (`make test-m6` tries to install them too, and goes on when it cannot).
      - run: tools/ci/playwright-install.sh chromium firefox webkit
      - run: make up
      # The exit test of milestone 6 (M6-T13), as docs/proof/m6-exit.md runs it: the checks that need no stack, the stack with the handshake required, the production headers, and the scenarios of
      # apps/web/test-e2e/m6/scenarios.ts in Chromium, Firefox and WebKit. The merge gate runs the parts of it that one browser and no stack change can show (the same document says which).
      - run: make test-m6
      # The last step of the exit test command: the licence report (no violation).
      - run: bun run licence
      - name: Collect Compose logs
        if: failure()
        run: docker compose -p grimoire logs --no-color > compose.log
      - name: Upload m6-exit-results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m6-exit-results
          path: |
            test-results/
            compose.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down-volumes
