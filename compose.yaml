name: grimoire

services:
  postgres:
    image: postgres:17@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
    environment:
      POSTGRES_DB: grimoire
      POSTGRES_USER: grimoire_admin
      POSTGRES_PASSWORD: ${GRIMOIRE_DEV_DB_PASSWORD} # development only; value in .env (copied from .env.example)
      GRIMOIRE_DEV_DB_PASSWORD: ${GRIMOIRE_DEV_DB_PASSWORD} # read by db/init/01-roles.sh
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - grimoire-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grimoire_admin -d grimoire"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  seaweedfs:
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    command: ["mini", "-dir=/data", "-s3", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${GRIMOIRE_DEV_S3_ACCESS_KEY} # development only; value in .env
      AWS_SECRET_ACCESS_KEY: ${GRIMOIRE_DEV_S3_SECRET_KEY} # development only; value in .env
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - grimoire-seaweed:/data
    healthcheck:
      # Signed ListBuckets must return HTTP 200 with a ListAllMyBucketsResult body:
      # proves the S3 gateway is serving and the filer/master behind it answer.
      test: ["CMD-SHELL", "curl -sf --aws-sigv4 aws:amz:us-east-1:s3 --user \"$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY\" http://127.0.0.1:8333/ | grep -q ListAllMyBucketsResult"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

volumes:
  grimoire-pgdata:
  grimoire-seaweed:
