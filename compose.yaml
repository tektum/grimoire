name: grimoire

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17-bookworm@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    environment:
      POSTGRES_DB: grimoire
      POSTGRES_USER: grimoire_admin
      POSTGRES_PASSWORD: ${GRIMOIRE_DEV_DB_PASSWORD} # development only; value in .env (copied from .env.example)
      GRIMOIRE_DEV_DB_PASSWORD: ${GRIMOIRE_DEV_DB_PASSWORD} # read by db/init/01-roles.sh
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - grimoire-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U grimoire_admin -d grimoire"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  seaweedfs:
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    command: ["mini", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    configs:
      - source: seaweedfs-identities
        target: /etc/seaweedfs/s3.json
        mode: 0444
    environment:
      AWS_ACCESS_KEY_ID: ${GRIMOIRE_DEV_S3_ACCESS_KEY} # development only; value in .env
      AWS_SECRET_ACCESS_KEY: ${GRIMOIRE_DEV_S3_SECRET_KEY} # development only; value in .env
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - grimoire-seaweed:/data
    healthcheck:
      # Signed ListBuckets must return HTTP 200 with a ListAllMyBucketsResult body:
      # proves the S3 gateway is serving and the filer/master behind it answer.
      test: ["CMD-SHELL", "curl -sf --aws-sigv4 aws:amz:us-east-1:s3 --user \"$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY\" http://127.0.0.1:8333/ | grep -q ListAllMyBucketsResult"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # Local mode with development tokens: no production sign-in adapter exists yet, so a non-local server that serves collaboration refuses to start.
  app:
    build:
      context: .
      args:
        GRIMOIRE_MODELS: "${GRIMOIRE_IMAGE_MODELS:-fetch}"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      GRIMOIRE_ROLE: all
      # TEST FACILITIES (M3-T01c): empty unless a test target sets them; the server refuses them outside local mode.
      GRIMOIRE_TEST_SLOW_CONVERT_MS: "${GRIMOIRE_TEST_SLOW_CONVERT_MS:-}"
      GRIMOIRE_TEST_SLOW_LOAD: "${GRIMOIRE_TEST_SLOW_LOAD:-}"
      GRIMOIRE_TEST_DISABLE_BREAKER: "${GRIMOIRE_TEST_DISABLE_BREAKER:-}"
      GRIMOIRE_LOCAL: "1"
      # On unless a test target turns it off: the e2e jobs build the image without the model files (GRIMOIRE_IMAGE_MODELS=skip) and run with it off.
      GRIMOIRE_SEMANTIC_SEARCH: "${GRIMOIRE_SEMANTIC_SEARCH:-on}"
      # A setting a test target may change and the stack otherwise leaves to the default of the server: empty counts as unset (the restart test of M7 sets 20 so that a run a killed container left is taken back in seconds, not 15 minutes).
      GRIMOIRE_JOBS_IMPORT_EXPIRE_SECONDS: "${GRIMOIRE_JOBS_IMPORT_EXPIRE_SECONDS:-}"
      # The server refuses local mode on a non-loopback bind unless told this is fine. It is fine here: inside the container the app must listen
      # on 0.0.0.0 (GRIMOIRE_HOST in the image), but this file publishes the port on 127.0.0.1 only (`ports` below), so only this machine reaches it.
      # Do not widen the published address while local mode is on: development tokens are the only sign-in.
      GRIMOIRE_LOCAL_ALLOW_NON_LOOPBACK: "1"
      # Every development token must carry this secret. `make up` generates it into .env when absent; there is no default, so the app refuses to start without it.
      GRIMOIRE_DEV_TOKEN_SECRET: "${GRIMOIRE_DEV_TOKEN_SECRET:-}"
      GRIMOIRE_ALLOWED_ORIGINS: "${GRIMOIRE_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}"
      GRIMOIRE_DATABASE_URL: postgresql://grimoire_app:${GRIMOIRE_DEV_DB_PASSWORD}@postgres:5432/grimoire
      # The operator role (docs/tenancy.md section 3.2), made by db/init/roles.psql: a database volume older than that lacks it until `make reset`.
      GRIMOIRE_DATABASE_OPS_URL: postgresql://grimoire_ops:${GRIMOIRE_DEV_DB_PASSWORD}@postgres:5432/grimoire
      # Empty means "use the default" (the settings loader treats an empty value as unset).
      GRIMOIRE_LOG_LEVEL: "${GRIMOIRE_LOG_LEVEL:-}"
      GRIMOIRE_TRUSTED_PROXY: "${GRIMOIRE_TRUSTED_PROXY:-}"
      GRIMOIRE_SHUTDOWN_SAVE_DEADLINE_MS: "${GRIMOIRE_SHUTDOWN_SAVE_DEADLINE_MS:-}"
      GRIMOIRE_DESCOPE_PROJECT_ID: "${GRIMOIRE_DESCOPE_PROJECT_ID:-}"
      GRIMOIRE_FIRST_ADMIN_EMAILS: "${GRIMOIRE_FIRST_ADMIN_EMAILS:-}"
      GRIMOIRE_ALLOWED_EMAIL_DOMAINS: "${GRIMOIRE_ALLOWED_EMAIL_DOMAINS:-}"
      GRIMOIRE_REFUSED_EMAIL_DOMAINS: "${GRIMOIRE_REFUSED_EMAIL_DOMAINS:-}"
      # The caps of one tenant (docs/tenancy.md section 3.8); empty keeps the default.
      GRIMOIRE_TENANT_MAX_USERS: "${GRIMOIRE_TENANT_MAX_USERS:-}"
      GRIMOIRE_TENANT_MAX_STORAGE_BYTES: "${GRIMOIRE_TENANT_MAX_STORAGE_BYTES:-}"
      GRIMOIRE_TENANT_MAX_PAGES: "${GRIMOIRE_TENANT_MAX_PAGES:-}"
      GRIMOIRE_DESCOPE_BASE_URL: "${GRIMOIRE_DESCOPE_BASE_URL:-}"
      GRIMOIRE_DESCOPE_MANAGEMENT_KEY: "${GRIMOIRE_DESCOPE_MANAGEMENT_KEY:-}"
      GRIMOIRE_DESCOPE_MAX_TOKEN_LIFETIME_SECONDS: "${GRIMOIRE_DESCOPE_MAX_TOKEN_LIFETIME_SECONDS:-86400}"
      GRIMOIRE_PUBLIC_API_URL: "${GRIMOIRE_PUBLIC_API_URL:-}"
      GRIMOIRE_PUBLIC_COLLAB_URL: "${GRIMOIRE_PUBLIC_COLLAB_URL:-}"
      # File store: the endpoint is the Compose service (the .env value points at the host port, for tests run on the host).
      GRIMOIRE_S3_ENDPOINT: http://seaweedfs:8333
      GRIMOIRE_S3_BUCKET: "${GRIMOIRE_S3_BUCKET:-grimoire}"
      GRIMOIRE_S3_ACCESS_KEY: ${GRIMOIRE_DEV_S3_APP_ACCESS_KEY:?copy GRIMOIRE_DEV_S3_APP_ACCESS_KEY from .env.example into .env}
      GRIMOIRE_S3_SECRET_KEY: ${GRIMOIRE_DEV_S3_APP_SECRET_KEY:?copy GRIMOIRE_DEV_S3_APP_SECRET_KEY from .env.example into .env}
      GRIMOIRE_S3_PUBLIC_ENDPOINT: "${GRIMOIRE_S3_PUBLIC_ENDPOINT:-}"
      GRIMOIRE_S3_REGION: "${GRIMOIRE_S3_REGION:-}"
      GRIMOIRE_S3_ADDRESSING_STYLE: "${GRIMOIRE_S3_ADDRESSING_STYLE:-}"
      GRIMOIRE_COLLAB_MAX_PAYLOAD_BYTES: "${GRIMOIRE_COLLAB_MAX_PAYLOAD_BYTES:-}"
      GRIMOIRE_COLLAB_MAX_STATE_BYTES: "${GRIMOIRE_COLLAB_MAX_STATE_BYTES:-}"
      GRIMOIRE_COLLAB_STATE_WARN_PERCENT: "${GRIMOIRE_COLLAB_STATE_WARN_PERCENT:-}"
      GRIMOIRE_COLLAB_MESSAGES_PER_WINDOW: "${GRIMOIRE_COLLAB_MESSAGES_PER_WINDOW:-}"
      GRIMOIRE_COLLAB_RATE_WINDOW_SECONDS: "${GRIMOIRE_COLLAB_RATE_WINDOW_SECONDS:-}"
      GRIMOIRE_COLLAB_MAX_CONNECTIONS_PER_PAGE: "${GRIMOIRE_COLLAB_MAX_CONNECTIONS_PER_PAGE:-}"
      GRIMOIRE_COLLAB_MAX_CONNECTIONS: "${GRIMOIRE_COLLAB_MAX_CONNECTIONS:-}"
      GRIMOIRE_COLLAB_MAX_OPEN_DOCUMENTS: "${GRIMOIRE_COLLAB_MAX_OPEN_DOCUMENTS:-}"
      GRIMOIRE_COLLAB_MEMORY_LIMIT_BYTES: "${GRIMOIRE_COLLAB_MEMORY_LIMIT_BYTES:-}"
      GRIMOIRE_COLLAB_MEMORY_GUARD_PERCENT: "${GRIMOIRE_COLLAB_MEMORY_GUARD_PERCENT:-}"
      GRIMOIRE_COLLAB_IDLE_UNLOAD_SECONDS: "${GRIMOIRE_COLLAB_IDLE_UNLOAD_SECONDS:-}"
      GRIMOIRE_COLLAB_CONNECT_ATTEMPTS_PER_WINDOW: "${GRIMOIRE_COLLAB_CONNECT_ATTEMPTS_PER_WINDOW:-}"
      GRIMOIRE_COLLAB_CONNECT_WINDOW_SECONDS: "${GRIMOIRE_COLLAB_CONNECT_WINDOW_SECONDS:-}"
      GRIMOIRE_COLLAB_BAN_SECONDS: "${GRIMOIRE_COLLAB_BAN_SECONDS:-}"
      GRIMOIRE_SEED_MAX_MARKDOWN_BYTES: "${GRIMOIRE_SEED_MAX_MARKDOWN_BYTES:-}"
      GRIMOIRE_SEED_TIMEOUT_MS: "${GRIMOIRE_SEED_TIMEOUT_MS:-}"
      GRIMOIRE_RESEED_TIMEOUT_MS: "${GRIMOIRE_RESEED_TIMEOUT_MS:-}"
      GRIMOIRE_SAVE_TIMEOUT_MS: "${GRIMOIRE_SAVE_TIMEOUT_MS:-}"
      GRIMOIRE_CONVERT_POOL_SIZE: "${GRIMOIRE_CONVERT_POOL_SIZE:-}"
      GRIMOIRE_COLLAB_DEBOUNCE_MS: "${GRIMOIRE_COLLAB_DEBOUNCE_MS:-}"
      GRIMOIRE_COLLAB_MAX_DEBOUNCE_MS: "${GRIMOIRE_COLLAB_MAX_DEBOUNCE_MS:-}"
      GRIMOIRE_COLLAB_MAX_UNAUTH_SOCKETS_PER_ADDRESS: "${GRIMOIRE_COLLAB_MAX_UNAUTH_SOCKETS_PER_ADDRESS:-}"
      GRIMOIRE_COLLAB_MAX_UNAUTH_SOCKETS: "${GRIMOIRE_COLLAB_MAX_UNAUTH_SOCKETS:-}"
      GRIMOIRE_COLLAB_MAX_UNAUTH_QUEUED_BYTES: "${GRIMOIRE_COLLAB_MAX_UNAUTH_QUEUED_BYTES:-}"
      GRIMOIRE_COLLAB_STORE_RETRY_BASE_MS: "${GRIMOIRE_COLLAB_STORE_RETRY_BASE_MS:-}"
      GRIMOIRE_COLLAB_STORE_RETRY_MAX_MS: "${GRIMOIRE_COLLAB_STORE_RETRY_MAX_MS:-}"
      GRIMOIRE_COLLAB_STORE_TIMEOUT_MS: "${GRIMOIRE_COLLAB_STORE_TIMEOUT_MS:-}"
      GRIMOIRE_COLLAB_RECHECK_SECONDS: "${GRIMOIRE_COLLAB_RECHECK_SECONDS:-60}"
      GRIMOIRE_COLLAB_PREAUTH_TIMEOUT_SECONDS: "${GRIMOIRE_COLLAB_PREAUTH_TIMEOUT_SECONDS:-5}"
      GRIMOIRE_COLLAB_MAX_SOCKETS_PER_USER: "${GRIMOIRE_COLLAB_MAX_SOCKETS_PER_USER:-20}"
      GRIMOIRE_COLLAB_MAX_DOCUMENTS_PER_USER: "${GRIMOIRE_COLLAB_MAX_DOCUMENTS_PER_USER:-50}"
      GRIMOIRE_COLLAB_BYTES_PER_SECOND_PER_USER: "${GRIMOIRE_COLLAB_BYTES_PER_SECOND_PER_USER:-2097152}"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # 1 GiB is the collaboration memory guard's default working limit (GRIMOIRE_COLLAB_MEMORY_LIMIT_BYTES); the other 512 MiB cover Node itself,
    # socket buffers and the Markdown worker; the semantic search's model thread adds up to 1.1 GB with the default model (measured peak of e5-base 0.98 GB, limit of the
    # container tests 1.1 GB; e5-small 0.74 GB). Past this the kernel kills the container instead of the whole machine, and the policy below restarts it.
    mem_limit: 3072m
    # `unless-stopped`: a crash or an out-of-memory kill comes back by itself, while `make down` and `docker stop` stay down.
    restart: unless-stopped
    # Docker's 10 s default would kill the server mid-save. The order is: this grace period >= the server's overall shutdown backstop >= the sum of its phase
    # deadlines (apps/server/src/lifecycle/budget.ts). For the default 45 s save deadline the backstop is 59 s, so 64 s (backstop + 5 s). If you raise
    # GRIMOIRE_SHUTDOWN_SAVE_DEADLINE_MS, raise this by the same amount (make check-compose checks the committed pair).
    stop_grace_period: 64s
    healthcheck:
      # The image has no shell or curl: Node's own fetch. /healthz means the process is up; /readyz also needs the schema, which `make migrate` creates after this reports healthy.
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # One-shot (same Dockerfile, so the same cached layers): `make migrate` runs it with the migrator role. The app image never changes the schema by itself.
  migrate:
    build:
      context: .
      args:
        GRIMOIRE_MODELS: "${GRIMOIRE_IMAGE_MODELS:-fetch}"
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GRIMOIRE_DATABASE_MIGRATION_URL: postgresql://grimoire_migrator:${GRIMOIRE_DEV_DB_PASSWORD}@postgres:5432/grimoire
      # The queues are defined by this command, so the expiry of the import queue is the one it is given (empty counts as unset; see the same line of the app).
      GRIMOIRE_JOBS_IMPORT_EXPIRE_SECONDS: "${GRIMOIRE_JOBS_IMPORT_EXPIRE_SECONDS:-}"
    command: ["apps/server/dist/cli.js", "migrate"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

# The runtime identity is rendered from .env, so no key is written twice in the repository. The admin identity comes from AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY above (healthcheck and bucket setup); the runtime identity may only read, write and list the configured bucket (`GRIMOIRE_S3_BUCKET`, default grimoire).
configs:
  seaweedfs-identities:
    content: |
      {"identities":[{"name":"app","credentials":[{"accessKey":"${GRIMOIRE_DEV_S3_APP_ACCESS_KEY:?copy GRIMOIRE_DEV_S3_APP_ACCESS_KEY from .env.example into .env}","secretKey":"${GRIMOIRE_DEV_S3_APP_SECRET_KEY:?copy GRIMOIRE_DEV_S3_APP_SECRET_KEY from .env.example into .env}"}],"actions":["Read:${GRIMOIRE_S3_BUCKET:-grimoire}","Write:${GRIMOIRE_S3_BUCKET:-grimoire}","List:${GRIMOIRE_S3_BUCKET:-grimoire}"]}]}

volumes:
  grimoire-pgdata:
  grimoire-seaweed:
