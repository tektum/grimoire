# The single source of tool versions for local work and CI (`mise install`). mise.lock pins the exact
# downloads with their checksums; Renovate keeps both current.
min_version = "2026.11.9" # the lockfile format (version 4) needs this release or newer

[tools]
node = "26"
bun = "1.4.4" # the package manager (Node stays the runtime)
gitleaks = "8.30.1"
actionlint = "1.7.12"
zizmor = "1.30.1"
opentofu = "1.13.9" # infra/descope plan and apply (OpenTofu, MPL-2.0)

[settings]
lockfile = true
# every platform variant mise may add on install, so that `mise install` leaves mise.lock unchanged; CI sets MISE_LOCKED=1 (an out-of-date lock fails there).
lockfile_platforms = ["linux-x64", "linux-x64-baseline", "linux-x64-musl", "linux-x64-musl-baseline", "linux-arm64", "linux-arm64-musl", "macos-arm64", "macos-x64", "macos-x64-baseline"]
